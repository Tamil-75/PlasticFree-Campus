<body>

  <!-- Animated ambient backdrop -->
  <div class="backdrop" aria-hidden="true">
    <div class="backdrop__grid"></div>
    <div class="backdrop__blob backdrop__blob--1"></div>
    <div class="backdrop__blob backdrop__blob--2"></div>
    <div class="backdrop__blob backdrop__blob--3"></div>
  </div>

  <!-- ================= APP SHELL ================= -->
  <div class="app">

    <!-- ---------- Sidebar ---------- -->
    <aside class="sidebar no-print">
      <div class="brandmark">
        <div class="brandmark__logo">
          <svg><use href="#i-leaf"></use></svg>
        </div>
        <div class="brandmark__text">
          <div class="brandmark__name">PlasticFree</div>
          <div class="brandmark__tag">Campus · Audit Suite</div>
        </div>
      </div>

      <nav class="nav" id="side-nav" aria-label="Primary">
        <div class="nav__label">Workspace</div>

        <a class="nav__item" href="#/dashboard" data-route="dashboard">
          <svg><use href="#i-grid"></use></svg>
          <span>Dashboard</span>
        </a>
        <a class="nav__item" href="#/audits" data-route="audits">
          <svg><use href="#i-clipboard"></use></svg>
          <span>Audits</span>
          <span class="nav__badge" id="nav-audit-count" hidden>0</span>
        </a>
        <a class="nav__item" href="#/analytics" data-route="analytics">
          <svg><use href="#i-chart"></use></svg>
          <span>Analytics</span>
        </a>

        <div class="nav__label">Intelligence</div>

        <a class="nav__item" href="#/insights" data-route="insights">
          <svg><use href="#i-bulb"></use></svg>
          <span>Insights</span>
          <span class="nav__badge" id="nav-insight-count" hidden>0</span>
        </a>
        <a class="nav__item" href="#/reports" data-route="reports">
          <svg><use href="#i-file"></use></svg>
          <span>Reports</span>
        </a>

        <div class="nav__label">System</div>

        <a class="nav__item" href="#/settings" data-route="settings">
          <svg><use href="#i-settings"></use></svg>
          <span>Settings</span>
        </a>
      </nav>

      <div class="sidebar__foot">
        <div class="ecocard">
          <div class="ecocard__label">Campus Eco Score</div>
          <div class="ecocard__row">
            <div class="ecocard__value" id="eco-score">0</div>
            <div class="ecocard__unit">/ 100</div>
          </div>
          <div class="ecocard__bar">
            <div class="ecocard__fill" id="eco-score-fill" style="width:0%"></div>
          </div>
          <div class="eco-hint ecocard__hint" id="eco-hint">Calculating campus health…</div>
        </div>
      </div>
    </aside>

    <!-- ---------- Main ---------- -->
    <div class="main">
      <header class="topbar no-print">
        <div class="topbar__titles">
          <div class="topbar__crumb">
            iGEN Green Day 2026 <span>/</span> Section C · Project 9
          </div>
          <h1 class="topbar__title" id="page-title">Dashboard</h1>
        </div>

        <div class="topbar__actions">
          <div class="topbar__date" id="today-chip">
            <svg><use href="#i-calendar"></use></svg>
            <span id="today-label">—</span>
          </div>

          <button class="btn btn--icon" id="theme-btn" data-tip="Toggle theme" aria-label="Toggle theme">
            <svg id="theme-icon"><use href="#i-sun"></use></svg>
          </button>

          <button class="btn btn--primary" id="new-audit-btn">
            <svg><use href="#i-plus"></use></svg>
            <span class="btn__label">New Audit</span>
          </button>
        </div>
      </header>

      <main class="content" id="view-root" tabindex="-1"></main>
    </div>
  </div>

  <!-- ---------- Mobile bottom nav ---------- -->
  <nav class="bottomnav no-print" id="bottom-nav" aria-label="Mobile">
    <a class="bottomnav__item" href="#/dashboard" data-route="dashboard">

    </a>
    <a class="bottomnav__item" href="#/audits" data-route="audits">

    </a>
    <a class="bottomnav__item" href="#/analytics" data-route="analytics">

    </a>
    <a class="bottomnav__item" href="#/insights" data-route="insights">

    </a>
    <a class="bottomnav__item" href="#/reports" data-route="reports">

    </a>
    <a class="bottomnav__item" href="#/settings" data-route="settings">
      <svg><use href="#i-settings"></use></svg><span>Settings</span>
    </a>
  </nav>
